<div class="wrapper-create-user">

  <div class="modal-header">
    <h3 class="modal-title">{{ modalTitle }}</h3>
    <button class="btn-icon" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <form class="modal-body" [formGroup]="form" (ngSubmit)="submit()" autocomplete="off">

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div class="input-group">
        <app-input-label label="Nombre" [required]="true" [control]="ctrl('name')" />
        <input type="text" formControlName="name" placeholder="Juan" />
      </div>
      <div class="input-group">
        <app-input-label label="Apellido" [required]="true" [control]="ctrl('lastname')" />
        <input type="text" formControlName="lastname" placeholder="Pérez" />
      </div>
    </div>

    <div class="input-group">
      <app-input-label label="Correo electrónico" [required]="true" [control]="ctrl('email')" />
      <input type="email" formControlName="email" placeholder="juan@empresa.com" />
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div class="input-group">
        <app-input-label label="Teléfono" [control]="ctrl('phone')" />
        <input type="tel" formControlName="phone" placeholder="+57 300 000 0000" />
      </div>
      <div class="input-group">
        <app-input-label label="Documento" [control]="ctrl('number_document')" />
        <input type="text" formControlName="number_document" placeholder="1234567890" />
      </div>
    </div>

    @if (isAdmin) {
      <div class="input-group">
        <app-input-label label="Roles" [required]="true" [control]="ctrl('role_ids')" />
        <ng-select
          class="ng-select-modal"
          [items]="roles"
          bindValue="value"
          bindLabel="label"
          [multiple]="true"
          formControlName="role_ids"
          [loading]="isLoadingRoles"
          placeholder="Selecciona roles">
        </ng-select>
      </div>

      <div class="input-group">
        <app-input-label label="Tenant" [required]="true" [control]="ctrl('tenant_id')" />
        <ng-select
          class="ng-select-modal"
          [items]="tenants"
          bindValue="value"
          bindLabel="label"
          formControlName="tenant_id"
          [loading]="isLoadingTenants"
          placeholder="Selecciona un tenant">
        </ng-select>
      </div>
    }

    @if (showNotificationChannel) {
      <div class="input-group">
        <app-input-label label="Canal de notificaciones" [required]="true" [control]="ctrl('notification_channel')" />
        <ng-select
          class="ng-select-modal"
          [items]="notificationChannels"
          bindValue="value"
          bindLabel="label"
          formControlName="notification_channel"
          [clearable]="false"
          placeholder="Selecciona un canal">
        </ng-select>
      </div>
    }

    @if (showBotsSelector) {
      <div class="input-group">
        <app-input-label label="Asistentes en los que recibirá contactos" [control]="ctrl('lead_assignee_bot_ids')" />
        <ng-select
          class="ng-select-modal"
          [items]="bots"
          bindValue="value"
          bindLabel="label"
          [multiple]="true"
          formControlName="lead_assignee_bot_ids"
          [loading]="isLoadingBots"
          placeholder="Selecciona asistentes (opcional)">
        </ng-select>
      </div>
    }

  </form>

  <div class="modal-footer">
    <button class="btn btn-secondary" (click)="close()">Cancelar</button>
    <button class="btn btn-primary" [disabled]="isLoading" (click)="submit()">
      {{ submitLabel }}
    </button>
  </div>

</div>
