<div class="wrapper-create-bot">

  <div class="modal-header">
    <h3 class="modal-title">{{ modalTitle }}</h3>
    <button class="btn-icon" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <form class="modal-body" [formGroup]="form" (ngSubmit)="submit()" autocomplete="off">

    <div class="input-group">
      <app-input-label label="Nombre del asistente" [required]="true" [control]="nameCtrl" />
      <input type="text" formControlName="bot_name" placeholder="Ej: Asistente de ventas" />
    </div>

    <div class="input-group" *ngIf="isAdmin">
      <app-input-label label="Empresa" [control]="form.get('tenant_id')" />
      <ng-select
        class="ng-select-modal"
        [items]="tenants"
        bindValue="value"
        bindLabel="label"
        formControlName="tenant_id"
        [clearable]="false"
        [placeholder]="isEdit ? 'Empresa asignada al asistente' : 'Selecciona una empresa'">
      </ng-select>
      @if (isEdit) {
        <small class="input-hint">La empresa de un asistente no se puede cambiar.</small>
      }
    </div>

    <div class="input-group">
      <app-input-label label="Descripción" [required]="true" [control]="descCtrl" />
      <textarea formControlName="bot_description" placeholder="Describe el propósito de este asistente..."></textarea>
    </div>

  </form>

  <div class="modal-footer">
    <button class="btn btn-secondary" (click)="close()">Cancelar</button>
    <button class="btn btn-primary" [disabled]="isLoading" (click)="submit()">
      {{ submitLabel }}
    </button>
  </div>

</div>
