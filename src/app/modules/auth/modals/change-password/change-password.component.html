<div class="wrapper-change-password">

  <div class="modal-header">
    <h3 class="modal-title">Cambiar contraseña</h3>
  </div>

  <div class="modal-body">
    <p class="modal-description">
      Debes establecer una nueva contraseña para continuar.
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()" autocomplete="off">

      <div class="input-group">
        <app-input-label label="Nueva contraseña" [required]="true" [control]="newCtrl" />
        <div class="password-field">
          <input [type]="showNew ? 'text' : 'password'" formControlName="new_password" />
          <button type="button" class="btn-icon" (click)="showNew = !showNew">
            <mat-icon>{{ showNew ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
      </div>

      <div class="input-group">
        <app-input-label
          label="Confirmar contraseña"
          [required]="true"
          [control]="confirmCtrl"
          [forceError]="mismatchError"
          [errorText]="mismatchError ? 'no coincide' : null" />
        <div class="password-field">
          <input [type]="showConfirm ? 'text' : 'password'" formControlName="confirm_password" />
          <button type="button" class="btn-icon" (click)="showConfirm = !showConfirm">
            <mat-icon>{{ showConfirm ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
      </div>

    </form>
  </div>

  <div class="modal-footer">
    <button class="btn btn-secondary" (click)="cancel()">Cancelar</button>
    <button class="btn btn-primary" [disabled]="isLoading" (click)="submit()">
      @if (isLoading) { Guardando... } @else { Actualizar contraseña }
    </button>
  </div>

</div>
