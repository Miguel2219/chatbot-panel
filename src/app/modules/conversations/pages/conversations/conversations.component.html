<div class="wrapper-conversations">

  <div class="module-header">
    <div class="module-title-group">
      <h3 class="title-page">Conversaciones</h3>
      <p class="subtitle-page">Historial de mensajes por bot y sesión</p>
    </div>
  </div>

  @if (isInitializing) {
    <div class="module-loading">
      <div class="loader-ring"></div>
    </div>
  } @else {
    <div class="conversations-filter">
      <div class="filter-item">
        <label class="select-label">Selecciona un bot</label>
        <ng-select
          class="ng-select-module"
          [items]="bots"
          bindValue="value"
          bindLabel="label"
          [(ngModel)]="selectedBotId"
          (change)="onBotChange()"
          [clearable]="false"
          placeholder="Selecciona un bot">
        </ng-select>
      </div>
    </div>

    @if (bots.length === 0) {
      <div class="empty-state">
        <mat-icon class="empty-icon">chat_bubble_outline</mat-icon>
        <div class="empty-title">No hay bots disponibles</div>
        <div class="empty-subtitle">Crea un bot primero para ver sus conversaciones</div>
      </div>
    } @else {
      <app-table
        titleTable="Conversaciones"
        [tableColumns]="tableColumns"
        [tableData]="conversations"
        [totalElements]="totalElements"
        [isPageable]="isPageable"
        [pageIndex]="pageIndex"
        [pageSize]="size"
        [isLoading]="isLoading"
        [actions]="actions"
        (filter)="loadConversations($event)">
      </app-table>
    }
  }

</div>
