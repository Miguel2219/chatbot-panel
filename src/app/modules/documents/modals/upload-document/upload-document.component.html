<div class="wrapper-upload-document">

  <div class="modal-header">
    <h3 class="modal-title">Subir Documentos</h3>
    <button class="btn-icon" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <form class="modal-body" [formGroup]="form" autocomplete="off">

    <!-- Admin: tenant + bot en dos columnas (col-6 cada uno). -->
    @if (isAdmin) {
      <div class="input-row">
        <div class="input-group">
          <app-input-label label="Empresa" [required]="true" [control]="tenantCtrl" />
          <ng-select
            class="ng-select-modal"
            [items]="tenants"
            bindValue="value"
            bindLabel="label"
            formControlName="tenant_id"
            [clearable]="false"
            placeholder="Selecciona una empresa">
          </ng-select>
        </div>

        <div class="input-group">
          <app-input-label label="Asistente" [required]="true" [control]="botCtrl" />
          <ng-select
            class="ng-select-modal"
            [items]="bots"
            bindValue="value"
            bindLabel="label"
            formControlName="bot_id"
            [clearable]="false"
            [loading]="isLoadingBots"
            [placeholder]="tenantCtrl.value ? 'Selecciona un asistente' : 'Primero selecciona una empresa'">
          </ng-select>
        </div>
      </div>
    } @else {
      <!-- Non-admin: tenant propio readonly + bot en col-12. -->
      <div class="input-group">
        <label class="readonly-label">Empresa</label>
        <div class="readonly-field">
          <mat-icon class="readonly-icon">business</mat-icon>
          <span>{{ userTenantName }}</span>
        </div>
      </div>

      <div class="input-group">
        <app-input-label label="Bot" [required]="true" [control]="botCtrl" />
        <ng-select
          class="ng-select-modal"
          [items]="bots"
          bindValue="value"
          bindLabel="label"
          formControlName="bot_id"
          [clearable]="false"
          [loading]="isLoadingBots"
          placeholder="Selecciona un asistente">
        </ng-select>
      </div>
    }

    <!-- Drop zone -->
    <label class="drop-zone" for="fileInput">
      <mat-icon class="drop-icon">cloud_upload</mat-icon>
      <div class="drop-title">Haz clic para seleccionar archivos</div>
      <div class="drop-subtitle">PDF, DOCX, TXT — Máx. 10 MB por archivo</div>
      <input
        id="fileInput"
        type="file"
        multiple
        accept=".pdf,.docx,.txt,.doc"
        (change)="onFileSelected($event)"
        style="display:none;">
    </label>

    <!-- Selected files list -->
    @if (selectedFiles.length > 0) {
      <div style="display:flex;flex-direction:column;gap:8px;">
        @for (file of selectedFiles; track file.name; let i = $index) {
          <div class="selected-file">
            <mat-icon class="file-icon">description</mat-icon>
            <div class="file-info">
              <div class="file-name">{{ file.name }}</div>
              <div class="file-size">{{ formatFileSize(file.size) }}</div>
            </div>
            <button type="button" class="btn-icon btn-icon-danger" (click)="removeFile(i)">
              <mat-icon style="font-size:16px;width:16px;height:16px;">close</mat-icon>
            </button>
          </div>
        }
      </div>
    }

  </form>

  <div class="modal-footer">
    <button class="btn btn-secondary" (click)="close()">Cancelar</button>
    <button class="btn btn-primary" [disabled]="!canSubmit" (click)="submit()">
      @if (isLoading) { Subiendo... } @else { Subir ({{ selectedFiles.length }}) }
    </button>
  </div>

</div>
