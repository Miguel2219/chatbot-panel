<div class="wrapper-leads">

  <div class="module-header">
    <div class="module-title-group">
      <h3 class="title-page">Contactos</h3>
      <p class="subtitle-page">Contactos capturados por tus asistentes</p>
    </div>
    @if (isAdmin) {
      <div class="module-actions">
        <button type="button" class="btn btn-secondary btn-filter" (click)="openFilterPanel()">
          <mat-icon>filter_list</mat-icon>
          Filtros
          @if (hasActiveFilters()) {
            <span class="filter-badge">{{ activeFilterCount() }}</span>
          }
        </button>
      </div>
    }
  </div>

  @if (isInitializing) {
    <div class="module-loading">
      <div class="loader-ring"></div>
    </div>
  } @else {
    <app-table
      titleTable="Contactos capturados"
      [tableColumns]="tableColumns"
      [tableData]="leads"
      [totalElements]="totalElements"
      [isPageable]="isPageable"
      [pageIndex]="pageIndex"
      [pageSize]="size"
      [isLoading]="isLoading"
      [actions]="actions"
      (filter)="loadLeads($event)">
    </app-table>
  }

</div>

@if (isAdmin) {
  <app-filter-panel
    [isOpen]="isFilterPanelOpen"
    [isAdmin]="isAdmin"
    [tenants]="tenants"
    [showBotFilter]="false"
    (closed)="closeFilterPanel()"
    (filtersApplied)="onFiltersApplied($event)"
    (filtersCleared)="onFiltersCleared()">
  </app-filter-panel>
}
