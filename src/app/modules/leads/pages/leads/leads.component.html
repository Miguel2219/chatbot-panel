<div class="wrapper-leads">

  <div class="module-header">
    <div class="module-title-group">
      <h3 class="title-page">Leads</h3>
      <p class="subtitle-page">Contactos capturados por tus chatbots</p>
    </div>
  </div>

  @if (isInitializing) {
    <div class="module-loading">
      <div class="loader-ring"></div>
    </div>
  } @else {
    <div class="leads-filter">
      <div class="filter-item">
        <label class="select-label">Selecciona un bot</label>
        <ng-select
          class="ng-select-module"
          [items]="bots"
          bindValue="value"
          bindLabel="label"
          [(ngModel)]="selectedBotId"
          (change)="onBotChange()"
          [clearable]="false"
          placeholder="Selecciona un bot">
        </ng-select>
      </div>
    </div>

    @if (bots.length === 0) {
      <div class="empty-state">
        <mat-icon class="empty-icon">person_search</mat-icon>
        <div class="empty-title">No hay bots disponibles</div>
        <div class="empty-subtitle">Crea un bot primero para ver sus leads</div>
      </div>
    } @else {
      <app-table
        titleTable="Leads capturados"
        [tableColumns]="tableColumns"
        [tableData]="leads"
        [totalElements]="leads.length"
        [isLoading]="isLoading"
        [actions]="actions"
        (edit)="openUpdateStatus($event)">
      </app-table>
    }
  }

</div>
