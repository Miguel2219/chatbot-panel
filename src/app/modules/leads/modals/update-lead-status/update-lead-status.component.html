<div class="wrapper-create-bot">
  <div class="modal-header">
    <h3 class="modal-title">Actualizar estado del lead</h3>
    <button class="btn-icon" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="modal-body">
    <p style="font-size:14px;color:#94A3B8;margin-bottom:8px;">
      Lead: <strong style="color:#F1F5F9;">{{ data.lead.name }}</strong>
    </p>

    <div class="input-group">
      <label class="input-label">Nuevo estado</label>
      <ng-select
        class="ng-select-modal"
        [items]="statusOptions"
        bindValue="value"
        bindLabel="label"
        [(ngModel)]="selectedStatus"
        [clearable]="false">
      </ng-select>
    </div>
  </div>

  <div class="modal-footer">
    <button class="btn btn-secondary" (click)="close()">Cancelar</button>
    <button class="btn btn-primary" [disabled]="isLoading" (click)="submit()">
      @if (isLoading) { Guardando... } @else { Actualizar }
    </button>
  </div>
</div>
